<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="카테고리별 IT 용어 사전 — 한 줄 정의, 비유, 예시, 관련 용어로 10초 안에 이해하기" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0f11" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <!-- 인덱스 JSON 을 JS 파싱 전에 미리 받는다 (첫 화면이 빨라진다) -->
    <link rel="preload" href="%BASE_URL%terms.json" as="fetch" crossorigin="anonymous" />
    <!-- 저장된 테마를 첫 페인트 전에 적용해 깜빡임을 막는다 (useTheme 과 같은 키) -->
    <script>
      try {
        var t = localStorage.getItem('devpedia:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <title>Devpedia — IT 용어 사전</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
