# 검증 → 타입 → 테스트 → 빌드 → (main push) GitHub Pages 배포.  잘못된 카드는 여기서 막힌다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 용어 카드 검증 (필드·관계·중복·고아)
        run: npm run validate
      - run: npm run typecheck
      - run: npm test
      - name: 빌드 (Pages 하위 경로 /<repo>/ 기준)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Lighthouse 는 루트(/)에서 서빙하므로 BASE_PATH 없는 빌드를 따로 만든다 (Pages 빌드는 /<repo>/ 절대 경로라 404 남)
      - name: Lighthouse 용 루트 경로 빌드
        run: npx vite build --outDir dist-lh
        env:
          BASE_PATH: /
      - name: Lighthouse (성능 90 미만이면 경고)
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages 사이트가 없으면 만들고(Source: GitHub Actions), 있으면 그대로 둔다 — Settings 클릭 불필요
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
